<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>장바구니 | 더랩 바이 블랑두</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/main.js" defer></script>
    <script type="module" src="../js/cart.js"></script>
    <script type="module" src="../js/pages/cart-page.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
  </head>
  <body>
    <script src="../js/site-layout.js"></script>

    <main>
      <section class="cart-page" aria-labelledby="cart-page-title">
        <div class="inner-box cart-page__inner">
          <nav class="cart-page__breadcrumb" aria-label="현재 위치">
            <a href="../index.html">HOME</a><span aria-hidden="true">/</span><strong>장바구니</strong>
          </nav>
          <header class="cart-page__heading">
            <h1 id="cart-page-title">장바구니</h1>
            <ol aria-label="주문 단계">
              <li aria-current="step">1. 장바구니</li>
              <li>2. 주문서 작성</li>
              <li>3. 주문완료</li>
            </ol>
          </header>
          <div class="cart-page__layout">
            <section class="cart-page__product-section" aria-labelledby="cart-products-title">
              <h2 id="cart-products-title">장바구니 상품</h2>
              <p class="cart-page__empty" data-cart-page-empty hidden>선택한 상품이 없습니다.</p>
              <ul class="cart-page__items" data-cart-page-items></ul>
              <p class="cart-page__error" data-cart-page-error role="alert" hidden></p>
            </section>
            <aside class="cart-summary" aria-label="결제 금액">
              <dl>
                <div><dt>총 상품금액</dt><dd data-cart-page-subtotal>0원</dd></div>
                <div><dt>총 배송비</dt><dd data-cart-page-shipping>0원</dd></div>
                <div class="cart-summary__total"><dt>결제예정금액</dt><dd data-cart-page-total>0원</dd></div>
              </dl>
              <button type="button" disabled>전체상품주문</button>
              <button type="button" disabled>선택상품주문</button>
            </aside>
          </div>
          <a class="cart-page__continue" href="../index.html#product-section">쇼핑 계속하기</a>
        </div>
      </section>
    </main>
  </body>
</html>
