<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>자주 묻는 질문 | 더랩 바이 블랑두</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/main.js" defer></script>
    <script type="module" src="../js/cart.js"></script>
    <script type="module" src="../js/pages/board-page.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
  </head>
  <body>
    <script src="../js/site-layout.js"></script>

    <main class="board-page board-page--faq" data-board-type="faq">
      <div class="board-page__inner">
        <nav class="board-breadcrumb" aria-label="현재 위치">
          <a href="../index.html">홈</a>
          <span aria-hidden="true">/</span>
          <span>게시판</span>
          <span aria-hidden="true">/</span>
          <strong aria-current="page">자주 묻는 질문</strong>
        </nav>

        <section class="board-content" aria-labelledby="board-title">
          <header class="board-heading">
            <h1 class="board-heading__title" id="board-title">자주 묻는 질문</h1>
            <button class="board-write-button" type="button" data-admin-write hidden>글쓰기</button>
          </header>

          <form class="board-write-form" data-board-write-form hidden>
            <div class="board-write-form__field">
              <label for="faq-write-title">제목</label>
              <input id="faq-write-title" name="title" type="text" maxlength="120" required>
            </div>
            <div class="board-write-form__field">
              <label for="faq-write-content">내용</label>
              <textarea id="faq-write-content" name="content" rows="8" required></textarea>
            </div>
            <div class="board-write-form__actions">
              <button class="board-write-form__cancel" type="button" data-board-write-cancel>취소</button>
              <button class="board-search__submit" type="submit">등록</button>
            </div>
            <p class="board-write-form__message" data-board-write-message role="status" aria-live="polite"></p>
          </form>

          <div class="board-category-tabs" role="group" aria-label="FAQ 카테고리">
            <button class="board-category-tabs__item is-active" type="button" aria-pressed="true" data-category="all">전체</button>
            <button class="board-category-tabs__item" type="button" aria-pressed="false" data-category="상품">상품</button>
            <button class="board-category-tabs__item" type="button" aria-pressed="false" data-category="주문">주문</button>
            <button class="board-category-tabs__item" type="button" aria-pressed="false" data-category="결제">결제</button>
          </div>

          <div class="board-table-scroll" tabindex="0" aria-label="자주 묻는 질문 목록">
            <table class="board-table board-table--faq">
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">제목</th>
                  <th scope="col">카테고리</th>
                  <th scope="col">작성자</th>
                </tr>
              </thead>
              <tbody data-board-list>
                <tr><td class="board-state" colspan="4" data-board-state>목록을 불러오는 중입니다.</td></tr>
              </tbody>
            </table>
          </div>

          <form class="board-search" id="board-search" data-board-search>
            <label class="visually-hidden" for="board-period">검색 기간</label>
            <select class="board-search__select" id="board-period" name="period">
              <option value="week">일주일</option>
              <option value="month">1개월</option>
              <option value="three-months">3개월</option>
              <option value="six-months">6개월</option>
              <option value="year">1년</option>
              <option value="all">전체 기간</option>
            </select>
            <label class="visually-hidden" for="board-search-target">검색 대상</label>
            <select class="board-search__select board-search__select--target" id="board-search-target" name="target">
              <option value="title">제목</option>
            </select>
            <label class="visually-hidden" for="board-search-query">검색어</label>
            <input class="board-search__input" id="board-search-query" name="query" type="search">
            <button class="board-search__submit" type="submit">찾기</button>
          </form>

          <nav class="board-pagination" aria-label="자주 묻는 질문 페이지">
            <button class="board-pagination__arrow" type="button" aria-label="이전 페이지" data-page-previous disabled>
              <span aria-hidden="true">‹</span>
            </button>
            <span class="board-pagination__numbers" data-page-numbers></span>
            <button class="board-pagination__arrow" type="button" aria-label="다음 페이지" data-page-next disabled>
              <span aria-hidden="true">›</span>
            </button>
          </nav>
        </section>
      </div>
    </main>

  </body>
</html>
