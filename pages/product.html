<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>상품 상세 | 더랩 바이 블랑두</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/main.js" defer></script>
    <script type="module" src="../js/cart.js"></script>
    <script type="module" src="../js/pages/product-detail.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
  </head>
  <body>
    <script src="../js/site-layout.js"></script>

    <main>
      <section class="product-detail-page" aria-label="상품 상세 정보">
        <div class="inner-box product-detail__inner">
          <nav class="product-detail__breadcrumb" aria-label="현재 위치">
            <a href="../index.html">HOME</a><span aria-hidden="true">/</span><span>상품 상세</span>
          </nav>
          <div class="product-detail__layout" data-product-detail hidden>
            <div class="product-detail__gallery">
              <div class="product-detail__image-frame">
                <img data-product-image alt="">
              </div>
              <div class="product-detail__thumbnail">
                <img data-product-thumbnail alt="">
              </div>
            </div>
            <section class="product-detail__information" aria-labelledby="product-name">
              <p class="product-detail__badge" data-product-badge hidden></p>
              <h1 class="product-detail__name" id="product-name" data-product-name></h1>
              <p class="product-detail__price-original" data-product-original hidden></p>
              <p class="product-detail__price"><strong data-product-price></strong><span data-product-discount hidden></span></p>
              <div class="product-detail__quantity-row">
                <span>수량</span>
                <div class="product-detail__quantity-control">
                  <button type="button" aria-label="수량 줄이기" data-quantity-decrease>−</button>
                  <output data-product-quantity>1</output>
                  <button type="button" aria-label="수량 늘리기" data-quantity-increase>+</button>
                </div>
                <strong data-product-total></strong>
              </div>
              <p class="product-detail__notice" data-product-error role="alert" hidden></p>
              <div class="product-detail__actions">
                <button class="product-detail__action product-detail__action--buy" type="button" disabled>BUY IT NOW</button>
                <button class="product-detail__action product-detail__action--cart" type="button" data-cart-add>ADD TO CART</button>
                <button class="product-detail__action product-detail__action--wish" type="button" disabled>WISH LIST</button>
              </div>
            </section>
          </div>
          <p class="product-detail__load-error" data-product-load-error role="alert" hidden></p>
        </div>
      </section>
    </main>
  </body>
</html>
