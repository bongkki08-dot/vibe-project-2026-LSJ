<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>로그인 / 회원가입 | 더랩 바이 블랑두</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/main.js" defer></script>
    <script type="module" src="../js/auth-ui.js"></script>
    <script type="module" src="../js/pages/auth-page.js"></script>
  </head>
  <body>
    <script src="../js/site-layout.js"></script>

    <main class="board-page auth-page">
      <div class="board-page__inner">
        <nav class="board-breadcrumb" aria-label="현재 위치">
          <a href="../index.html">홈</a>
          <span aria-hidden="true">/</span>
          <strong aria-current="page">로그인 / 회원가입</strong>
        </nav>
        <div class="auth-page__content">
          <section class="auth-panel" id="login" aria-labelledby="login-title">
            <header class="board-heading">
              <h1 class="board-heading__title" id="login-title">로그인</h1>
              <p class="board-heading__subtitle">이메일과 비밀번호를 입력해 주세요.</p>
            </header>
            <form class="auth-form" data-auth-login-form>
              <div class="inquiry-form__field">
                <label for="login-email">이메일</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="inquiry-form__field">
                <label for="login-password">비밀번호</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
              </div>
              <p class="auth-form__message" data-auth-message role="status" aria-live="polite"></p>
              <button class="board-search__submit" type="submit">로그인</button>
            </form>
          </section>

          <section class="auth-panel auth-panel--signup" id="signup" aria-labelledby="signup-title">
            <header class="board-heading">
              <h2 class="board-heading__title" id="signup-title">회원가입</h2>
              <p class="board-heading__subtitle">이름, 아이디, 이메일, 비밀번호를 입력해 주세요.</p>
            </header>
            <form class="auth-form" data-auth-signup-form>
              <div class="inquiry-form__field">
                <label for="signup-name">이름</label>
                <input id="signup-name" name="name" type="text" autocomplete="name" maxlength="80" required>
              </div>
              <div class="inquiry-form__field">
                <label for="signup-username">아이디</label>
                <div class="auth-form__username">
                  <input id="signup-username" name="username" type="text" autocomplete="username" minlength="4" maxlength="20" required>
                  <button class="board-search__submit" type="button" data-check-username>중복 확인</button>
                </div>
                <p class="auth-form__message" data-username-message role="status">아이디 중복 확인이 필요합니다.</p>
              </div>
              <div class="inquiry-form__field">
                <label for="signup-email">이메일</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="inquiry-form__field">
                <label for="signup-password">비밀번호</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
                <p class="auth-form__message">Firebase 정책에 따라 6자 이상 입력해 주세요.</p>
              </div>
              <p class="auth-form__message" data-signup-message role="status" aria-live="polite"></p>
              <button class="board-search__submit" type="submit">회원가입</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
